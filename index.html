<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Outpost 117</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172b23;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;gap:8px;padding:12px;color:white;font-size:14px;pointer-events:none}#hud span{background:#14241bcc;border:1px solid #ffffff22;border-radius:12px;padding:9px 11px;box-shadow:0 3px 10px #0004}#tip{position:fixed;top:65px;left:12px;color:#fff;background:#14241bcc;padding:9px 12px;border-radius:12px;font-size:12px;max-width:75%;pointer-events:none}#controls{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:22px;width:125px;height:125px;border:2px solid #ffffff55;background:#ffffff16;border-radius:50%;touch-action:none}#knob{position:absolute;left:39px;top:39px;width:44px;height:44px;background:#d7e8d4bb;border-radius:50%;box-shadow:0 0 15px #fff5}#buttons{position:fixed;right:16px;bottom:calc(25px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}button{border:1px solid #ffffff66;background:#263c35e8;color:#fff;border-radius:15px;padding:14px 16px;font-weight:750;min-width:112px;box-shadow:0 5px 12px #0005}button:active{background:#527c59}#message{position:fixed;top:43%;left:50%;transform:translate(-50%,-50%);color:white;font-weight:800;font-size:23px;text-shadow:0 3px 9px #000;pointer-events:none;text-align:center;opacity:0;transition:opacity .25s}#start{position:fixed;inset:0;background:#10221cdb;color:white;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:28px;text-align:center;gap:15px}#start h1{font-size:32px;margin:0}#start p{line-height:1.55;max-width:340px}#start button{background:#81ac45;color:#122013;font-size:19px;padding:17px 38px}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="hp">♥ 100</span><span id="wood">🪵 0</span><span id="metal">◆ 0</span><span id="wave">Волна 1</span></div><div id="tip">Подойди к деревьям и руде, чтобы добывать. Защищай базу!</div><div id="message"></div><div id="controls"><div id="knob"></div></div><div id="buttons"><button id="build">Турель: 8🪵 3◆</button><button id="repair">Ремонт: 8🪵</button><button id="upgrade">Урон +: 12◆</button></div><div id="start"><h1>OUTPOST 117</h1><p>Управляй зелёным спартанцем одним пальцем. Добывай дерево и металл, строй турели и отбивай монстров. Турели стреляют автоматически.</p><button id="play">ИГРАТЬ</button></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const world=1100,base={x:550,y:550,hp:300,max:300};let player,trees,ores,turrets,enemies,shots,particles,wood,metal,wave,kills,elapsed,spawnTimer,playerShot=0,started=false,ended=false,damage=1,joy={x:0,y:0},keys={};const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function init(){player={x:550,y:690,hp:100,max:100,hit:0,harvest:0,face:1};trees=[];ores=[];turrets=[];enemies=[];shots=[];particles=[];wood=0;metal=0;wave=1;kills=0;elapsed=0;spawnTimer=3;playerShot=0;damage=1;ended=false;for(let i=0;i<42;i++){let x=rand(50,1050),y=rand(50,1050);if(Math.hypot(x-550,y-550)>145)trees.push({x,y,hp:4,kind:'tree'})}for(let i=0;i<22;i++){let x=rand(50,1050),y=rand(50,1050);if(Math.hypot(x-550,y-550)>140)ores.push({x,y,hp:5,kind:'ore'})}updateHUD()}function msg(s){let e=document.getElementById('message');e.textContent=s;e.style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>e.style.opacity=0,1150)}function updateHUD(){document.getElementById('hp').textContent='♥ '+Math.ceil(player.hp)+' | База '+Math.ceil(base.hp);document.getElementById('wood').textContent='🪵 '+wood;document.getElementById('metal').textContent='◆ '+metal;document.getElementById('wave').textContent='Волна '+wave}function spawn(){let a=rand(0,Math.PI*2),r=rand(390,530);enemies.push({x:Math.max(20,Math.min(1080,550+Math.cos(a)*r)),y:Math.max(20,Math.min(1080,550+Math.sin(a)*r)),hp:2+wave*.65,max:2+wave*.65,attack:0,speed:34+wave*2})}function pop(x,y,color,n=5){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-65,65),vy:rand(-90,15),life:rand(.3,.7),color})}function update(dt){if(!started||ended)return;elapsed+=dt;let next=1+Math.floor(elapsed/35);if(next!==wave){wave=next;msg('ВОЛНА '+wave)}spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=Math.max(.48,2.3-wave*.17)}let vx=joy.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),vy=joy.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),len=Math.hypot(vx,vy);if(len>1){vx/=len;vy/=len}player.x=Math.max(20,Math.min(1080,player.x+vx*170*dt));player.y=Math.max(20,Math.min(1080,player.y+vy*170*dt));if(Math.abs(vx)>.1)player.face=Math.sign(vx);player.harvest-=dt;let near=[...trees,...ores].filter(o=>dist(o,player)<57).sort((a,b)=>dist(a,player)-dist(b,player))[0];if(near&&player.harvest<=0){player.harvest=.42;near.hp--;pop(near.x,near.y,near.kind==='tree'?'#d7aa56':'#9ceaff',3);if(near.hp<=0){if(near.kind==='tree'){wood+=5;trees.splice(trees.indexOf(near),1)}else{metal+=4;ores.splice(ores.indexOf(near),1)}pop(near.x,near.y,'#f7dc81',12);updateHUD()}}playerShot-=dt;if(playerShot<=0){let target=enemies.filter(e=>dist(player,e)<180).sort((a,b)=>dist(player,a)-dist(player,b))[0];if(target){shots.push({x:player.x,y:player.y-15,target,damage:damage,life:.65});playerShot=.65}}for(let t of turrets){t.cd-=dt;if(t.cd<=0){let target=enemies.filter(e=>dist(t,e)<230).sort((a,b)=>dist(t,a)-dist(t,b))[0];if(target){t.cd=.46;shots.push({x:t.x,y:t.y-20,target,damage:damage*1.2,life:.5})}}}for(let s of shots){if(s.target.hp<=0){s.life=0;continue}let dx=s.target.x-s.x,dy=s.target.y-s.y,l=Math.hypot(dx,dy);if(l<15){s.target.hp-=s.damage;s.life=0;pop(s.x,s.y,'#ffd45c',3)}else{s.x+=dx/l*480*dt;s.y+=dy/l*480*dt;s.life-=dt}}shots=shots.filter(s=>s.life>0);for(let e of enemies){let target=dist(e,player)<105?player:base,dx=target.x-e.x,dy=target.y-e.y,l=Math.hypot(dx,dy);if(l>35){e.x+=dx/l*e.speed*dt;e.y+=dy/l*e.speed*dt}else{e.attack-=dt;if(e.attack<=0){e.attack=.9;if(target===base)base.hp-=5+wave*.6;else player.hp-=7;pop(target.x,target.y,'#ff5c68',6)}}}let dead=enemies.filter(e=>e.hp<=0);for(let e of dead){kills++;if(kills%3===0)metal++;pop(e.x,e.y,'#a26bea',8)}enemies=enemies.filter(e=>e.hp>0);if(player.hp<=0||base.hp<=0){ended=true;document.getElementById('start').style.display='flex';document.querySelector('#start h1').textContent='БАЗА ПАЛА';document.querySelector('#start p').textContent=`Волна ${wave} · Уничтожено монстров: ${kills}. Попробуй построить турели раньше.`;document.getElementById('play').textContent='ЗАНОВО'}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);updateHUD()}
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#82b66c';ctx.fillRect(0,0,W,H);let scale=Math.min(W/430,H/720)*1.35;scale=Math.max(.7,Math.min(1.3,scale));ctx.save();ctx.translate(W/2-player.x*scale,H/2-player.y*scale);ctx.scale(scale,scale);rect(0,0,world,world,'#83b36c');for(let x=0;x<world;x+=55)for(let y=0;y<world;y+=55){let n=Math.sin(x*7.13+y*3.1);if(n>.2){circle(x+20,y+18,2,'#78a85f');circle(x+29,y+26,2,'#a3c985')}}rect(450,455,200,190,'#bca87b');rect(460,465,180,170,'#cdbd94');ctx.strokeStyle='#8a7960';ctx.lineWidth=8;ctx.strokeRect(450,455,200,190);rect(505,510,90,80,'#677987');poly([[505,510],[550,480],[595,510]],'#8998a5');rect(531,554,37,36,'#263f43');rect(515,495,70,9,'#d8b65c');ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('БАЗА',550,537);rect(476,448,148,9,'#532f2d');rect(476,448,148*Math.max(0,base.hp/base.max),9,'#69d763');for(let t of trees){circle(t.x+5,t.y+8,18,'#577a46');rect(t.x-5,t.y-3,10,28,'#8b5d38');circle(t.x,t.y-17,26,'#326f42');circle(t.x-13,t.y-8,21,'#418d4c');circle(t.x+15,t.y-7,20,'#4e9a51');circle(t.x-6,t.y-27,17,'#59a35b')}for(let o of ores){poly([[o.x-20,o.y+12],[o.x-14,o.y-10],[o.x+3,o.y-22],[o.x+19,o.y-8],[o.x+23,o.y+12]],'#6c7f89');poly([[o.x-6,o.y+10],[o.x-3,o.y-17],[o.x+10,o.y-10],[o.x+12,o.y+10]],'#7cddf2')}for(let t of turrets){circle(t.x,t.y+6,24,'#46575c');rect(t.x-18,t.y-10,36,28,'#78868d');circle(t.x,t.y-13,15,'#d6ae4e');rect(t.x-5,t.y-36,10,28,'#394a54');circle(t.x,t.y-12,6,'#f8d779')}for(let e of enemies){circle(e.x+3,e.y+8,18,'#486a4e');circle(e.x,e.y,16,'#7140a0');circle(e.x-9,e.y-9,8,'#8653b5');circle(e.x+9,e.y-9,8,'#8653b5');circle(e.x-5,e.y-2,3,'#f8e367');circle(e.x+5,e.y-2,3,'#f8e367');rect(e.x-14,e.y-23,28*Math.max(0,e.hp/e.max),3,'#ed6b78')}for(let s of shots){circle(s.x,s.y,5,'#fff6a1');circle(s.x,s.y,2,'#fff')}circle(player.x+3,player.y+14,19,'#527d4b');circle(player.x,player.y,18,'#455e2e');rect(player.x-12,player.y-4,24,28,'#70863c');rect(player.x-17,player.y+1,7,19,'#536c31');rect(player.x+10,player.y+1,7,19,'#536c31');circle(player.x,player.y-15,15,'#647d3a');rect(player.x-12,player.y-18,24,10,'#e4b947');rect(player.x-9,player.y-16,18,5,'#f7d57d');ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.fillText('117',player.x,player.y+13);for(let p of particles){ctx.globalAlpha=Math.min(1,p.life*2);circle(p.x,p.y,3,p.color)}ctx.globalAlpha=1;ctx.restore()}let last=performance.now();function frame(now){let dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);function build(){if(!started||ended)return;if(wood<8||metal<3){msg('Нужно 8 дерева и 3 металла');return}if(dist(player,base)>200){msg('Подойди к базе');return}wood-=8;metal-=3;let a=turrets.length*Math.PI*2/8;turrets.push({x:550+Math.cos(a)*125,y:550+Math.sin(a)*125,cd:0});msg('ТУРЕЛЬ ПОСТРОЕНА');updateHUD()}document.getElementById('build').onclick=build;document.getElementById('repair').onclick=()=>{if(wood<8){msg('Нужно 8 дерева');return}if(dist(player,base)>200){msg('Подойди к базе');return}wood-=8;base.hp=Math.min(base.max,base.hp+65);player.hp=Math.min(100,player.hp+20);msg('БАЗА ОТРЕМОНТИРОВАНА');updateHUD()};document.getElementById('upgrade').onclick=()=>{if(metal<12){msg('Нужно 12 металла');return}metal-=12;damage+=.8;msg('УРОН УВЕЛИЧЕН');updateHUD()};document.getElementById('play').onclick=()=>{base.hp=base.max;init();started=true;document.getElementById('start').style.display='none';msg('СОБИРАЙ РЕСУРСЫ!')};const pad=document.getElementById('controls'),knob=document.getElementById('knob');function move(e){let r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),m=Math.min(1,l/45);joy.x=l?dx/l*m:0;joy.y=l?dy/l*m:0;knob.style.transform=`translate(${joy.x*38}px,${joy.y*38}px)`}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);move(e)});pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))move(e)});function reset(){joy.x=joy.y=0;knob.style.transform='translate(0,0)'}pad.addEventListener('pointerup',reset);pad.addEventListener('pointercancel',reset);addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);init();started=true;document.getElementById('start').style.display='none';</script></body></html>
