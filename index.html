function projectile(from,to,kind){let g=group(from.x,from.z);ball(g,0,.5,0,.13,kind==='metal'?cyan:gold);particles.push({g,from:{...from},to:{...to},t:0,duration:.65+Math.random()*.3})}
function enemy(){let a=Math.random()*Math.PI*2,r=19+Math.random()*4,x=Math.cos(a)*r,z=Math.sin(a)*r,g=group(x,z);let rat=mesh(new T.SphereGeometry(.63,10,8),mat(0x343438),g);rat.scale.set(.9,.6,1.4);rat.position.y=.6;for(let side of [-1,1]){ball(g,side*.25,.77,.5,.11,mat(0xc7433b));let horn=mesh(new T.ConeGeometry(.17,.4,6),metalMat,g);horn.position.set(side*.32,1.02,-.12)}let tail=mesh(new T.CylinderGeometry(.035,.07,1.2,6),woodMat,g);tail.rotation.x=Math.PI/2;tail.position.set(0,.45,-1.12);enemies.push({x,z,g,hp:2+Math.floor(wave/2),cd:0,speed:1.65+wave*.15})}
function shootAt(from,target){let g=group(from.x,from.z);ball(g,0,1.1,0,.18,gold);bullets.push({g,target,speed:17})}
function step(dt){if(dead)return;clock+=dt;wave=1+Math.floor(clock/30);if(clock>toastUntil)document.getElementById('toast').style.opacity=0;
let vx=stick.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),vz=stick.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),l=Math.hypot(vx,vz);if(l>1){vx/=l;vz/=l}hero.position.x=Math.max(-26,Math.min(26,hero.position.x+vx*6.2*dt));hero.position.z=Math.max(-26,Math.min(26,hero.position.z+vz*6.2*dt));if(l>.05){hero.rotation.y=Math.atan2(vx,vz);legL.rotation.x=Math.sin(clock*13)*.52;legR.rotation.x=-legL.rotation.x;leftArm.rotation.x=-legL.rotation.x*.7;rightArm.rotation.x=-legR.rotation.x*.45}else{legL.rotation.x=legR.rotation.x=0;leftArm.rotation.x=rightArm.rotation.x=0}
const miningTarget=[...trees,...ores].find(o=>o.hp>0&&dist({x:hero.position.x,z:hero.position.z},o)<1.8);
if(miningTarget&&l<.18){const dx=miningTarget.x-hero.position.x,dz=miningTarget.z-hero.position.z;hero.rotation.y=Math.atan2(dx,dz);const swing=Math.sin(clock*19);rightArm.rotation.x=-1.2-swing*.8;leftArm.rotation.x=-.45+swing*.22;hero.rotation.z=Math.sin(clock*19)*.075;hero.position.y=Math.max(0,Math.sin(clock*19)*.035);rifle.visible=false;}else{hero.rotation.z=0;hero.position.y=0;rifle.visible=true;}
let mining=!!miningTarget&&l<.18;
if(soldierMixer){soldierMixer.update(dt);setSoldierAnimation(l>.1?'walk':mining?'run':'idle');}
ll.rotation.x=l>.05?Math.sin(clock*12)*.55:0;rl.rotation.x=-ll.rotation.x;
la.rotation.x=l>.05?-ll.rotation.x*.5:0;ra.rotation.x=mining?-1.2+Math.sin(clock*19)*.7:(l>.05?ll.rotation.x*.5:-.3);
torso.rotation.z=mining?Math.sin(clock*19)*.08:0;
slashMat.opacity=mining?Math.max(0,Math.sin(clock*19))*.8:0;slash.rotation.z=clock*1.8;
cargoWood.forEach((o,i)=>o.visible=i<Math.min(20,carryWood));cargoMetal.forEach((o,i)=>o.visible=i<Math.min(20,carryMetal));
if(dist({x:hero.position.x,z:hero.position.z},{x:1.7,z:3.1})<1.5&&(carryWood+carryMetal)>0){coins+=carryWood*2+carryMetal*4;carryWood=0;carryMetal=0;toast('ПРОДАНО');hud()}
harvest-=dt;if(harvest<=0&&miningTarget){const r=miningTarget;r.hp-=1+weaponLevel;let isTree=trees.includes(r);isTree?(wood++,carryWood++):(metal++,carryMetal++);r.g.scale.y=Math.max(.35,r.hp/r.maxHp);projectile({x:r.x,z:r.z},{x:hero.position.x,z:hero.position.z},isTree?'wood':'metal');if(r.hp===0)scene.remove(r.g);harvest=.32/(1+weaponLevel*.25);hud()}
upgradeCooldown-=dt;upgradeRing.rotation.z=clock*.5;if(dist({x:hero.position.x,z:hero.position.z},{x:-2.3,z:3.1})<1.2&&upgradeCooldown<=0){upgradeCooldown=2;upgradeWeapon()}
for(const p of pads){
if(p.built)continue;
p.ring.rotation.z+=dt*.4;
if(!p.building&&dist({x:hero.position.x,z:hero.position.z},p)<1.5&&wood>=p.cw&&metal>=p.cm){
wood-=p.cw;metal-=p.cm;p.building=true;p.progress=0;p.label.visible=false;p.platform.visible=false;p.ring.visible=false;
p.site=group(p.x,p.z);
const foundation=cube(p.site,0,.1,0,2,.2,2,metalMat);foundation.scale.set(.01,.01,.01);
const frame=new T.Group();p.site.add(frame);
for(const x of [-.85,.85])for(const z of [-.85,.85])cube(frame,x,.9,z,.15,1.8,.15,woodMat);
frame.scale.y=.001;
const walls=new T.Group();p.site.add(walls);
if(p.type==='house'){cube(walls,0,.85,0,1.8,1.7,1.7,woodMat);cube(walls,0,1.85,0,2.1,.25,2.1,roof)}
else if(p.type==='turret'){cube(walls,0,.75,0,1.3,1.5,1.2,metalMat);cube(walls,0,1.65,0,1.7,.3,1.5,dark)}
else{for(let i=-3;i<=3;i++)cube(walls,i*.3,.75,0,.2,1.5,.2,woodMat)}
walls.scale.y=.001;p.stages=[foundation,frame,walls];hud();
}
if(p.building){
p.progress=Math.min(1,p.progress+dt/4.5);const q=p.progress;
p.stages[0].scale.setScalar(Math.min(1,q*4));
p.stages[1].scale.y=Math.max(.001,Math.min(1,(q-.25)*3));
p.stages[2].scale.y=Math.max(.001,Math.min(1,(q-.6)*2.5));
if(Math.random()<dt*8){const sx=p.x+rand(-.8,.8),sz=p.z+rand(-.8,.8),spark=group(sx,sz);ball(spark,0,rand(.5,1.8),0,.07,gold);particles.push({g:spark,from:{x:sx,z:sz},to:{x:sx+rand(-.4,.4),z:sz+rand(-.4,.4)},t:0,duration:.4})}
if(q>=1){p.built=true;p.building=false;scene.remove(p.site);scene.remove(p.g);if(p.type==='turret')turret(p.x,p.z);else if(p.type==='house')house(p.x,p.z);else fence()}
}
}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.t+=dt;let k=Math.min(1,p.t/p.duration);p.g.position.x=p.from.x+(p.to.x-p.from.x)*k;p.g.position.z=p.from.z+(p.to.z-p.from.z)*k;p.g.position.y=Math.sin(k*Math.PI)*2;if(k>=1){scene.remove(p.g);particles.splice(i,1)}}
spawn-=dt;if(spawn<=0){enemy();spawn=Math.max(.55,2.8-wave*.15)}
for(const e of enemies){let h={x:hero.position.x,z:hero.position.z},target=dist(e,h)<2.7?h:{x:0,z:0},dx=target.x-e.x,dz=target.z-e.z,ll=Math.hypot(dx,dz)||1;if(ll>.9){e.x+=dx/ll*e.speed*dt;e.z+=dz/ll*e.speed*dt;e.g.position.set(e.x,Math.sin(clock*8+e.x)*.1,e.z)}else{e.cd-=dt;if(e.cd<=0){if(target===h){hp-=7;if(hp<=0){hp=100;hero.position.set(0,0,5);baseHp-=20}}else baseHp-=wall?2.5:5;e.cd=.9;hud()}}}
shot-=dt;if(shot<=0){let h={x:hero.position.x,z:hero.position.z},target=enemies.filter(e=>dist(e,h)<6).sort((a,b)=>dist(a,h)-dist(b,h))[0];if(target){shootAt(h,target);shot=.65}}
for(const t of turrets){t.cd-=dt;if(t.cd>0)continue;let target=enemies.filter(e=>dist(e,t)<9).sort((a,b)=>dist(a,t)-dist(b,t))[0];if(target){shootAt(t,target);t.cd=.4}}
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i],e=b.target;if(e.hp<=0){scene.remove(b.g);bullets.splice(i,1);continue}let dx=e.x-b.g.position.x,dz=e.z-b.g.position.z,ll=Math.hypot(dx,dz)||1;if(ll<.45){e.hp--;scene.remove(b.g);bullets.splice(i,1)}else{b.g.position.x+=dx/ll*b.speed*dt;b.g.position.z+=dz/ll*b.speed*dt}}
for(let i=enemies.length-1;i>=0;i--)if(enemies[i].hp<=0){scene.remove(enemies[i].g);enemies.splice(i,1);kills++;if(Math.random()<.3)metal++;hud()}
houseTick+=dt;if(houseTick>10&&houses.length){houseTick=0;wood+=houses.length*2;toast('ДОМА ПРИНЕСЛИ ДЕРЕВО');hud()}
if(baseHp<=0){dead=true;document.getElementById('reset').style.display='grid'}}
let last=performance.now();function frame(now){let dt=Math.min(.045,(now-last)/1000);last=now;step(dt);let target=new T.Vector3(hero.position.x,0,hero.position.z);camera.position.lerp(new T.Vector3(target.x+7.3,14,target.z+10),.085);camera.lookAt(target.x,1,target.z);renderer.render(scene,camera);requestAnimationFrame(frame)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});hud();loading.remove();requestAnimationFrame(frame);
})();
</script></body></html>
