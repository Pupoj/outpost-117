<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>

const mat=(c)=>new T.MeshStandardMaterial({color:c,roughness:.83,flatShading:true}),grass=mat(0x79b976),dark=mat(0x244d3e),woodMat=mat(0x936b45),leaf=mat(0x338c58),leaf2=mat(0x4da76b),metalMat=mat(0x7896a4),gold=mat(0xeec765),cyan=mat(0x56ead8),purple=mat(0x7b469a),white=mat(0xf0e8c9),roof=mat(0xb95d48);

 cube(arm,0,-.12,.02,.43,.34,.47,armorLight);

}

 cube(leg,0,-.18,.12,.4,.4,.28,armor);
 cube(leg,0,-.48,.08,.4,.3,.42,armorLight);
 cube(leg,0,-.68,.15,.43,.18,.6,armorDark);
}

cube(hero,-.2,1.35,-.52,.1,.48,.09,glow);
cube(hero,.2,1.35,-.52,.1,.48,.09,glow);

cube(rifle,.12,-.59,.88,.1,.1,.55,metalMat);
cube(rifle,.12,-.49,.27,.24,.13,.4,armorDark);
const chestCanvas=document.createElement('canvas');chestCanvas.width=256;chestCanvas.height=128;
const chestCtx=chestCanvas.getContext('2d');chestCtx.fillStyle='#f2f0dc';chestCtx.font='900 82px system-ui';chestCtx.textAlign='center';chestCtx.fillText('117',128,94);
const chestTexture=new T.CanvasTexture(chestCanvas);const chestBadge=new T.Mesh(new T.PlaneGeometry(.48,.24),new T.MeshBasicMaterial({map:chestTexture,transparent:true,side:T.DoubleSide}));

let trees=[],ores=[],turrets=[],houses=[],enemies=[],bullets=[],particles=[],pads=[],wood=0,metal=0,hp=100,baseHp=300,wave=1,clock=0,spawn=0,harvest=0,shot=0,houseTick=0,kills=0,dead=false,wall=null;
function tree(x,z){let g=group(x,z);cube(g,0,.65,0,.42,1.3,.42,woodMat);let a=mesh(new T.ConeGeometry(1.25,2.4,6),leaf,g);a.position.y=2.1;let b=mesh(new T.ConeGeometry(.95,1.8,6),leaf2,g);b.position.y=3.25;trees.push({x,z,g,hp:10})}

for(let i=0;i<52;i++){let x=(Math.random()-.5)*48,z=(Math.random()-.5)*48;if(Math.hypot(x,z)<9)continue;i%4?tree(x,z):ore(x,z)}
const types=[['turret',-5,5,8,3],['fence',5,0,14,5],['house',-6,-3,12,4],['turret',5,5,8,3],['house',0,-6,12,4],['turret',-5,-5,8,3]];
function label(text){let c=document.createElement('canvas');c.width=256;c.height=100;let x=c.getContext('2d');x.fillStyle='#143d35';x.fillRect(0,0,256,100);x.font='bold 28px system-ui';x.fillStyle='white';x.textAlign='center';x.fillText(text,128,43);let tx=new T.CanvasTexture(c),sp=new T.Sprite(new T.SpriteMaterial({map:tx,transparent:true,depthTest:false}));sp.scale.set(2.5,.98,1);return sp}
for(const [type,x,z,cw,cm] of types){let g=group(x,z);let platform=mesh(new T.CylinderGeometry(1.18,1.18,.12,6),cyan,g);platform.position.y=.08;let ring=mesh(new T.TorusGeometry(1.08,.08,5,24),gold,g);ring.rotation.x=Math.PI/2;ring.position.y=.17;let l=label(type==='turret'?'ТУРЕЛЬ':type==='house'?'ДОМ':'ЗАБОР');l.position.y=2.15;g.add(l);pads.push({type,x,z,cw,cm,g,ring,platform,label:l,built:false,building:false,progress:0})}
function turret(x,z){let g=group(x,z);cube(g,0,.5,0,1.4,1,.95,metalMat);cube(g,0,1.2,0,1.7,.35,1.3,dark);let gun=cube(g,0,1.42,.7,.34,.3,1.55,metalMat);turrets.push({x,z,g,gun,cd:0})}
function house(x,z){let g=group(x,z);cube(g,0,.75,0,2,1.5,1.8,woodMat);let r=mesh(new T.ConeGeometry(1.65,1.25,4),roof,g);r.rotation.y=Math.PI/4;r.position.y=2.05;cube(g,0,.58,.94,.58,1.1,.08,dark);cube(g,.62,1.16,.94,.34,.38,.08,gold);houses.push({x,z,g})}
function fence(){wall=group(0,0);for(let x=-3.8;x<=3.8;x+=.85){for(let z of [-3.8,3.8]){if(z>0&&Math.abs(x)<1.1)continue;cube(wall,x,.73,z,.23,1.45,.23,woodMat)}}for(let z=-3.8;z<=3.8;z+=.85)for(let x of [-3.8,3.8])cube(wall,x,.73,z,.23,1.45,.23,woodMat)}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z),rand=(a,b)=>a+Math.random()*(b-a);
let stick={x:0,y:0},joy=document.getElementById('joy'),nub=document.getElementById('nub'),pid=null;
function joyMove(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.max(1,Math.hypot(x,y)),a=Math.min(m,44);stick.x=x/m*a/44;stick.y=y/m*a/44;nub.style.transform='translate('+stick.x*42+'px,'+stick.y*42+'px)'}
joy.addEventListener('pointerdown',e=>{pid=e.pointerId;joy.setPointerCapture(pid);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===pid)joyMove(e)});function release(e){if(e.pointerId===pid){pid=null;stick.x=stick.y=0;nub.style.transform=''}}joy.addEventListener('pointerup',release);joy.addEventListener('pointercancel',release);
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let toastUntil=0;function toast(s){document.getElementById('toast').textContent=s;document.getElementById('toast').style.opacity=1;toastUntil=clock+2}
function projectile(from,to,kind){let g=group(from.x,from.z);ball(g,0,.5,0,.13,kind==='metal'?cyan:gold);particles.push({g,from:{...from},to:{...to},t:0,duration:.65+Math.random()*.3})}
function enemy(){let a=Math.random()*Math.PI*2,r=19+Math.random()*4,x=Math.cos(a)*r,z=Math.sin(a)*r,g=group(x,z);ball(g,0,.68,0,.68,purple);let horn=mesh(new T.ConeGeometry(.25,.6,5),gold,g);horn.position.set(0,1.38,0);ball(g,-.24,.86,.54,.12,gold);ball(g,.24,.86,.54,.12,gold);enemies.push({x,z,g,hp:2+Math.floor(wave/2),cd:0,speed:1.65+wave*.15})}

function step(dt){if(dead)return;clock+=dt;wave=1+Math.floor(clock/30);if(clock>toastUntil)document.getElementById('toast').style.opacity=0;
let vx=stick.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),vz=stick.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),l=Math.hypot(vx,vz);if(l>1){vx/=l;vz/=l}hero.position.x=Math.max(-26,Math.min(26,hero.position.x+vx*6.2*dt));hero.position.z=Math.max(-26,Math.min(26,hero.position.z+vz*6.2*dt));if(l>.05){hero.rotation.y=Math.atan2(vx,vz);legL.rotation.x=Math.sin(clock*13)*.52;legR.rotation.x=-legL.rotation.x;leftArm.rotation.x=-legL.rotation.x*.7;rightArm.rotation.x=-legR.rotation.x*.45}else{legL.rotation.x=legR.rotation.x=0;leftArm.rotation.x=rightArm.rotation.x=0}

for(const p of pads){if(p.built)continue;p.ring.rotation.z+=dt;p.platform.material.emissive=new T.Color(0x12695a);p.platform.material.emissiveIntensity=.35+.25*Math.sin(clock*5);if(!p.building&&dist({x:hero.position.x,z:hero.position.z},p)<1.5&&wood>=p.cw&&metal>=p.cm){wood-=p.cw;metal-=p.cm;p.building=true;p.progress=0;for(let i=0;i<p.cw+p.cm;i++){let type=i<p.cw?'wood':'metal';let from={x:hero.position.x,z:hero.position.z},to={x:p.x,z:p.z};setTimeout(()=>projectile(from,to,type),i*65)}toast('СТРОИТЕЛЬСТВО');hud()}if(p.building){p.progress+=dt/1.8;p.platform.scale.y=1+p.progress*7;if(p.progress>=1){p.built=true;p.building=false;scene.remove(p.g);if(p.type==='turret')turret(p.x,p.z);else if(p.type==='house')house(p.x,p.z);else fence();toast(p.type==='turret'?'ТУРЕЛЬ ГОТОВА':p.type==='house'?'ДОМ ГОТОВ':'ЗАБОР ГОТОВ')}}}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.t+=dt;let k=Math.min(1,p.t/p.duration);p.g.position.x=p.from.x+(p.to.x-p.from.x)*k;p.g.position.z=p.from.z+(p.to.z-p.from.z)*k;p.g.position.y=Math.sin(k*Math.PI)*2;if(k>=1){scene.remove(p.g);particles.splice(i,1)}}

for(const e of enemies){let h={x:hero.position.x,z:hero.position.z},target=dist(e,h)<2.7?h:{x:0,z:0},dx=target.x-e.x,dz=target.z-e.z,ll=Math.hypot(dx,dz)||1;if(ll>.9){e.x+=dx/ll*e.speed*dt;e.z+=dz/ll*e.speed*dt;e.g.position.set(e.x,Math.sin(clock*8+e.x)*.1,e.z)}else{e.cd-=dt;if(e.cd<=0){if(target===h){hp-=7;if(hp<=0){hp=100;hero.position.set(0,0,5);baseHp-=20}}else baseHp-=wall?2.5:5;e.cd=.9;hud()}}}
